services:
  inbxr:
    build: .
    container_name: inbxr
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
      - "0.0.0.0:25:25"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - SMTP_PORT=25
      - DATABASE_PATH=/data/mail.db
    volumes:
      - ./data:/data
