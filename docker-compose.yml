services:
  inbxr:
    build: .
    container_name: inbxr
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
      - "0.0.0.0:25:25"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - SMTP_PORT=25
      - MAIL_DOMAIN=${MAIL_DOMAIN:-inbxr.cloud}
      - DATABASE_PATH=/data/mail.db
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DOTDIGITAL_API_USER=${DOTDIGITAL_API_USER:-}
      - DOTDIGITAL_API_PASSWORD=${DOTDIGITAL_API_PASSWORD:-}
      - DOTDIGITAL_API_BASE_URL=${DOTDIGITAL_API_BASE_URL:-https://r1-api.dotdigital.com}
      - DOTDIGITAL_FROM_ADDRESS=${DOTDIGITAL_FROM_ADDRESS:-}
    volumes:
      - ./data:/data
